services:
  - type: web
    name: aqua-marketplace
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn mystore.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aqua-db
          property: connectionString

databases:
  - name: aqua-db
    plan: free